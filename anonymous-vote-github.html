<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Group Leader Ballot</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />

<!--
  ====================== SETUP (read this) ======================
  This page needs a free Firebase project to store votes, since a
  static GitHub Pages site has no server of its own.

  1. Go to https://console.firebase.google.com -> "Add project" (free).
  2. In your new project: Build -> Firestore Database -> Create database
     -> start in test mode (or use the rules below) -> pick a region.
  3. Project settings (gear icon) -> General -> "Your apps" -> click the
     </> web icon -> register an app -> copy the firebaseConfig object.
  4. Paste that object into FIREBASE_CONFIG below, replacing the sample.
  5. In Firestore -> Rules, paste this and click Publish:

     rules_version = '2';
     service cloud.firestore {
       match /databases/{database}/documents {
         match /polls/{pollId} {
           allow read, write: if true;
           match /votes/{voteId} {
             allow read: if true;
             allow create: if true;
             allow update, delete: if false;
           }
         }
       }
     }

  These rules are open (anyone with the link can read/write) which is
  fine for a casual group vote, but don't reuse this project for
  anything sensitive.
  =================================================================
-->
<script>
  var FIREBASE_CONFIG = {
    apiKey: "AIzaSyC4XrnWZ0l7mvxERtORW3djV99EEjDqcYY",
    authDomain: "anonymous-da955.firebaseapp.com",
    projectId: "anonymous-da955",
    storageBucket: "anonymous-da955.firebasestorage.app",
    messagingSenderId: "1064302100091",
    appId: "1:1064302100091:web:e09386673a4d9e59032cde"
  };
</script>

<script src="https://www.gstatic.com/firebasejs/12.16.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore-compat.js"></script>

<style>
  :root {
    --bg: #1b2430;
    --bg-2: #212b39;
    --paper: #f6f2e8;
    --paper-line: #e4ddc9;
    --text: #2b2a25;
    --text-muted: #6b6558;
    --brass: #b8892b;
    --brass-deep: #8f6a1e;
    --sage: #4f6b52;
    --rose: #9c4a3c;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: radial-gradient(ellipse at 50% -10%, var(--bg-2), var(--bg) 65%);
    min-height: 100vh;
    font-family: 'Inter', sans-serif;
    color: var(--text);
  }
  .scene {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 28px 18px;
  }
  .ballot-card {
    background: var(--paper);
    width: 100%;
    max-width: 460px;
    border-radius: 14px;
    padding: 30px 26px 28px;
    box-shadow: 0 24px 60px rgba(0,0,0,.4), 0 2px 0 rgba(255,255,255,.03) inset;
    position: relative;
  }
  .perf {
    height: 10px;
    margin: -30px -26px 22px;
    background-image: radial-gradient(circle, var(--bg) 3px, transparent 3.5px);
    background-size: 16px 10px;
    opacity: .55;
  }
  .eyebrow {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--brass-deep);
    margin-bottom: 8px;
    font-weight: 600;
  }
  .h1 {
    font-family: 'Fraunces', serif;
    font-size: 26px;
    font-weight: 600;
    line-height: 1.2;
    margin: 0 0 10px;
    color: var(--text);
  }
  .sub {
    font-size: 14px;
    color: var(--text-muted);
    line-height: 1.5;
    margin: 0 0 20px;
  }
  .headline {
    font-family: 'Fraunces', serif;
    font-size: 17px;
    font-weight: 600;
    color: var(--sage);
    margin: 0 0 4px;
  }
  .field-label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    color: var(--text-muted);
    margin: 16px 0 6px;
  }
  .text-input {
    width: 100%;
    font-family: 'Inter', sans-serif;
    font-size: 15px;
    padding: 12px 14px;
    border: 1px solid var(--paper-line);
    border-radius: 8px;
    background: #fff;
    color: var(--text);
    outline: none;
  }
  .text-input:focus { border-color: var(--brass); }
  .input-row { display: flex; gap: 8px; }
  .input-row .text-input { flex: 1; }
  .chip-list {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin: 14px 0 6px;
    min-height: 20px;
  }
  .chip {
    display: flex;
    align-items: center;
    gap: 6px;
    background: #fff;
    border: 1px solid var(--paper-line);
    border-radius: 20px;
    padding: 6px 6px 6px 14px;
    font-size: 14px;
  }
  .chip-remove {
    border: none;
    background: var(--paper-line);
    color: var(--text);
    width: 20px;
    height: 20px;
    border-radius: 50%;
    cursor: pointer;
    font-size: 14px;
    line-height: 1;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .chip-remove:hover { background: var(--rose); color: #fff; }
  .empty-hint, .hint {
    font-size: 13px;
    color: var(--text-muted);
    margin: 6px 0 0;
  }
  .btn {
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 15px;
    border: none;
    border-radius: 8px;
    padding: 14px 20px;
    cursor: pointer;
    transition: transform .08s ease, background .15s ease, opacity .15s ease;
  }
  .btn:active { transform: scale(.98); }
  .btn-block { width: 100%; margin-top: 18px; }
  .btn-primary { background: var(--brass); color: #211705; }
  .btn-primary:hover:not(:disabled) { background: var(--brass-deep); color: #fff; }
  .btn-primary:disabled { opacity: .35; cursor: not-allowed; }
  .btn-secondary { background: transparent; border: 1px solid var(--paper-line); color: var(--text); }
  .btn-secondary:hover { border-color: var(--brass); }
  .btn-danger-link {
    display: block;
    margin: 18px auto 0;
    background: none;
    border: none;
    color: var(--rose);
    text-decoration: underline;
    font-size: 13px;
    font-family: 'Inter', sans-serif;
    cursor: pointer;
  }
  .btn-row { display: flex; gap: 10px; margin-top: 18px; }
  .btn-row .btn { flex: 1; }

  .ballot-options { display: flex; flex-direction: column; gap: 10px; margin-top: 4px; }
  .ballot-option {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 14px 16px;
    border: 1px solid var(--paper-line);
    border-radius: 10px;
    background: #fff;
    cursor: pointer;
    transition: border-color .15s, background .15s;
  }
  .ballot-option:hover { border-color: var(--brass); }
  .ballot-option.selected { border-color: var(--brass); background: #fbf3e0; }
  .ballot-mark {
    width: 20px; height: 20px; border-radius: 50%;
    border: 2px solid var(--text); flex-shrink: 0; position: relative;
  }
  .ballot-option.selected .ballot-mark::after {
    content: ''; position: absolute; inset: 3px; border-radius: 50%; background: var(--brass);
  }
  .ballot-name { font-size: 15px; }
  .lock-hint { text-align: center; margin-top: 14px; }

  .stamp-wrap { display: flex; justify-content: center; margin-bottom: 14px; }
  .stamp {
    border: 3px double var(--sage);
    color: var(--sage);
    font-family: 'IBM Plex Mono', monospace;
    letter-spacing: 2px;
    text-transform: uppercase;
    font-size: 12px;
    font-weight: 600;
    padding: 10px 18px;
    border-radius: 50% / 42%;
    display: inline-block;
    transform: rotate(-7deg);
    animation: stampIn .35s ease-out;
  }
  @keyframes stampIn {
    from { transform: rotate(-7deg) scale(1.7); opacity: 0; }
    to { transform: rotate(-7deg) scale(1); opacity: 1; }
  }

  .results-list { display: flex; flex-direction: column; gap: 16px; margin: 18px 0 4px; }
  .result-top { display: flex; align-items: baseline; gap: 8px; margin-bottom: 6px; }
  .result-rank {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--brass-deep);
    width: 26px;
  }
  .result-name { flex: 1; font-size: 15px; font-weight: 600; }
  .result-count { font-family: 'IBM Plex Mono', monospace; font-size: 14px; color: var(--text-muted); }
  .tally-row { padding-left: 34px; min-height: 22px; display: flex; align-items: flex-end; flex-wrap: wrap; }
  .tally-bar { width: 4px; height: 20px; background: var(--sage); display: inline-block; margin-right: 3px; border-radius: 1px; }
  .tally-group { position: relative; display: inline-flex; align-items: flex-end; margin-right: 9px; }
  .tally-strike {
    position: absolute; width: 27px; height: 3px; background: var(--brass);
    left: -3px; top: 8px; transform: rotate(-35deg); border-radius: 2px;
  }
  .tally-empty { color: var(--text-muted); font-size: 13px; }

  .loader {
    width: 34px; height: 34px; border-radius: 50%;
    border: 3px solid rgba(246,242,232,.25); border-top-color: var(--brass);
    animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .setup-notice {
    background: #fff; border: 1px solid var(--rose); border-radius: 10px;
    padding: 16px; font-size: 13px; line-height: 1.6; color: var(--text);
  }
  .setup-notice code { background: var(--paper-line); padding: 1px 5px; border-radius: 4px; }
  .setup-notice a { color: var(--brass-deep); }

  @media (max-width: 380px) {
    .ballot-card { padding: 24px 18px 22px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
  <div id="app">
    <div class="scene"><div class="loader"></div></div>
  </div>

<script>
(function () {
  var state = {
    view: 'loading',
    meta: null,
    voted: false,
    tally: null,
    setupCandidates: [],
    selectedCandidate: null,
    justVoted: false
  };

  var app = document.getElementById('app');
  var db = null;
  var pollRef = null;
  var votesUnsub = null;

  function escapeHtml(str) {
    return String(str).replace(/[&<>"']/g, function (ch) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch];
    });
  }

  function genId() {
    if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
    return Math.random().toString(36).slice(2) + Date.now().toString(36);
  }

  function renderTallyMarks(count) {
    var capped = Math.min(count, 25);
    if (capped === 0) return '<span class="tally-empty">—</span>';
    var fullGroups = Math.floor(capped / 5);
    var remainder = capped % 5;
    var marks = '';
    for (var g = 0; g < fullGroups; g++) {
      marks += '<span class="tally-group">' +
        '<span class="tally-bar"></span><span class="tally-bar"></span>' +
        '<span class="tally-bar"></span><span class="tally-bar"></span>' +
        '<span class="tally-strike"></span></span>';
    }
    if (remainder > 0) {
      var bars = '';
      for (var i = 0; i < remainder; i++) bars += '<span class="tally-bar"></span>';
      marks += '<span class="tally-group partial">' + bars + '</span>';
    }
    return marks;
  }

  function renderSetupNotice() {
    return '<div class="scene"><div class="ballot-card"><div class="perf"></div>' +
      '<div class="eyebrow">Setup needed</div><h1 class="h1">Connect a database first</h1>' +
      '<div class="setup-notice">This page needs a free Firebase project to store votes. ' +
      'Open this file in a text editor, follow the comment block at the top of the ' +
      '<code>&lt;head&gt;</code> section, and paste your project\'s config into ' +
      '<code>FIREBASE_CONFIG</code>. Full steps: ' +
      '<a href="https://console.firebase.google.com" target="_blank" rel="noopener">console.firebase.google.com</a></div>' +
      '</div></div>';
  }

  function renderSetup() {
    var candidatesHtml = state.setupCandidates.length
      ? state.setupCandidates.map(function (c, i) {
          return '<div class="chip"><span>' + escapeHtml(c) + '</span>' +
            '<button type="button" class="chip-remove" data-action="remove-candidate" data-index="' + i + '" aria-label="Remove ' + escapeHtml(c) + '">&times;</button></div>';
        }).join('')
      : '<p class="empty-hint">No one added yet.</p>';
    var canStart = state.setupCandidates.length >= 2;
    return '' +
      '<div class="scene"><div class="ballot-card">' +
        '<div class="perf"></div>' +
        '<div class="eyebrow">New ballot</div>' +
        '<h1 class="h1">Set up the vote</h1>' +
        '<p class="sub">Add each person being considered. Votes stay anonymous — only the totals show.</p>' +
        '<label class="field-label" for="pollTitleInput">Ballot question</label>' +
        '<input id="pollTitleInput" class="text-input" type="text" maxlength="80" value="Who should lead the group?" />' +
        '<label class="field-label" for="candidateInput">Add a name</label>' +
        '<div class="input-row">' +
          '<input id="candidateInput" class="text-input" type="text" maxlength="40" placeholder="e.g. Jordan" autocomplete="off" />' +
          '<button type="button" class="btn btn-secondary" data-action="add-candidate">Add</button>' +
        '</div>' +
        '<div class="chip-list">' + candidatesHtml + '</div>' +
        '<button type="button" class="btn btn-primary btn-block" data-action="start-vote"' + (canStart ? '' : ' disabled') + '>Open the vote</button>' +
        (canStart ? '' : '<p class="hint">Add at least 2 names to open the vote.</p>') +
      '</div></div>';
  }

  function renderVoting() {
    var candidates = state.meta.candidates || [];
    var optionsHtml = candidates.map(function (name) {
      var sel = state.selectedCandidate === name ? ' selected' : '';
      return '<div class="ballot-option' + sel + '" data-action="select-candidate" data-name="' + escapeHtml(name) + '">' +
        '<span class="ballot-mark"></span><span class="ballot-name">' + escapeHtml(name) + '</span></div>';
    }).join('');
    return '' +
      '<div class="scene"><div class="ballot-card">' +
        '<div class="perf"></div>' +
        '<div class="eyebrow">Cast your vote</div>' +
        '<h1 class="h1">' + escapeHtml(state.meta.title) + '</h1>' +
        '<div class="ballot-options">' + optionsHtml + '</div>' +
        '<button type="button" class="btn btn-primary btn-block" data-action="submit-vote"' + (state.selectedCandidate ? '' : ' disabled') + '>Seal my vote</button>' +
        '<p class="hint lock-hint">🔒 Anonymous. No one can see who you voted for — only the totals.</p>' +
      '</div></div>';
  }

  function renderResults() {
    var meta = state.meta;
    var tally = state.tally || { counts: {}, total: 0 };
    var entries = Object.entries(tally.counts).sort(function (a, b) { return b[1] - a[1]; });
    var maxCount = entries.length ? entries[0][1] : 0;
    var leaders = entries.filter(function (e) { return e[1] === maxCount && maxCount > 0; }).map(function (e) { return e[0]; });

    var rows = entries.map(function (entry, i) {
      var name = entry[0], count = entry[1];
      var rankLabel = tally.total > 0 ? (i + 1) + (i === 0 ? 'st' : i === 1 ? 'nd' : i === 2 ? 'rd' : 'th') : '';
      return '<div class="result-row">' +
        '<div class="result-top"><span class="result-rank">' + rankLabel + '</span>' +
        '<span class="result-name">' + escapeHtml(name) + '</span>' +
        '<span class="result-count">' + count + '</span></div>' +
        '<div class="tally-row">' + renderTallyMarks(count) + '</div></div>';
    }).join('');

    var headline = '';
    if (meta.status === 'closed') {
      if (tally.total === 0) headline = 'No votes were cast.';
      else if (leaders.length > 1) headline = "It's a tie between " + leaders.join(' and ') + '.';
      else headline = '🏆 ' + leaders[0] + ' wins with ' + maxCount + ' vote' + (maxCount === 1 ? '' : 's') + '.';
    }

    return '' +
      '<div class="scene"><div class="ballot-card">' +
        '<div class="perf"></div>' +
        (state.justVoted ? '<div class="stamp-wrap"><span class="stamp">Vote sealed</span></div>' : '') +
        '<div class="eyebrow">' + (meta.status === 'closed' ? 'Final tally' : 'Current tally') + '</div>' +
        '<h1 class="h1">' + escapeHtml(meta.title) + '</h1>' +
        (headline ? '<p class="headline">' + escapeHtml(headline) + '</p>' : '') +
        '<p class="sub">' + tally.total + ' vote' + (tally.total === 1 ? '' : 's') + ' cast' + (meta.status !== 'closed' ? ' so far — updates live' : '') + '</p>' +
        '<div class="results-list">' + (rows || '<p class="empty-hint">No candidates.</p>') + '</div>' +
        '<div class="btn-row">' +
          (meta.status !== 'closed' ? '<button type="button" class="btn btn-primary" data-action="close-poll">Close the vote</button>' : '') +
        '</div>' +
        '<button type="button" class="btn-danger-link" data-action="reset-poll">Start a new ballot</button>' +
      '</div></div>';
  }

  function render() {
    if (state.view === 'no-config') app.innerHTML = renderSetupNotice();
    else if (state.view === 'setup') app.innerHTML = renderSetup();
    else if (state.view === 'voting') app.innerHTML = renderVoting();
    else if (state.view === 'results') app.innerHTML = renderResults();
    else app.innerHTML = '<div class="scene"><div class="loader"></div></div>';
  }

  function subscribeVotes(pollId, candidates) {
    if (votesUnsub) { votesUnsub(); votesUnsub = null; }
    votesUnsub = pollRef.collection('votes').onSnapshot(function (snap) {
      var counts = {};
      candidates.forEach(function (c) { counts[c] = 0; });
      snap.forEach(function (doc) {
        var c = doc.data().candidate;
        if (counts.hasOwnProperty(c)) counts[c]++;
      });
      state.tally = { counts: counts, total: snap.size };
      if (state.view === 'results') render();
    }, function () { /* ignore transient read errors */ });
  }

  async function addCandidateFromInput() {
    var input = document.getElementById('candidateInput');
    if (!input) return;
    var name = input.value.trim();
    if (!name || name.length > 40) return;
    var exists = state.setupCandidates.some(function (c) { return c.toLowerCase() === name.toLowerCase(); });
    if (exists) { input.value = ''; return; }
    state.setupCandidates.push(name);
    render();
    var newInput = document.getElementById('candidateInput');
    if (newInput) newInput.focus();
  }

  function removeCandidate(index) {
    state.setupCandidates.splice(index, 1);
    render();
  }

  async function startVote() {
    if (state.setupCandidates.length < 2) return;
    var titleInput = document.getElementById('pollTitleInput');
    var title = (titleInput && titleInput.value.trim()) || 'Who should lead the group?';
    var pollId = genId();
    var meta = { title: title, candidates: state.setupCandidates.slice(), status: 'open', pollId: pollId, createdAt: Date.now() };
    try {
      await pollRef.set(meta);
    } catch (e) { alert('Could not save the ballot. Check your Firebase setup and rules.'); return; }
  }

  function selectCandidate(name) {
    state.selectedCandidate = name;
    render();
  }

  async function submitVote() {
    if (!state.selectedCandidate || !state.meta) return;
    try {
      await pollRef.collection('votes').add({ candidate: state.selectedCandidate, ts: Date.now() });
      localStorage.setItem('voted_' + state.meta.pollId, '1');
    } catch (e) { alert('Could not submit your vote. Check your Firebase setup and rules.'); return; }
    state.voted = true;
    state.view = 'results';
    state.justVoted = true;
    subscribeVotes(state.meta.pollId, state.meta.candidates);
    render();
    state.justVoted = false;
  }

  async function closePoll() {
    if (!state.meta) return;
    try {
      await pollRef.update({ status: 'closed' });
    } catch (e) { alert('Could not close the ballot.'); }
  }

  async function resetPoll() {
    if (!confirm('Start a new ballot? This clears the current candidates and tally for everyone.')) return;
    try {
      await pollRef.set({ status: 'setup' });
    } catch (e) { alert('Could not reset the ballot.'); return; }
    state.setupCandidates = [];
    state.selectedCandidate = null;
  }

  app.addEventListener('click', function (e) {
    var t = e.target.closest('[data-action]');
    if (!t) return;
    var action = t.dataset.action;
    if (action === 'add-candidate') addCandidateFromInput();
    else if (action === 'remove-candidate') removeCandidate(Number(t.dataset.index));
    else if (action === 'start-vote') startVote();
    else if (action === 'select-candidate') selectCandidate(t.dataset.name);
    else if (action === 'submit-vote') submitVote();
    else if (action === 'close-poll') closePoll();
    else if (action === 'reset-poll') resetPoll();
  });
  app.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && e.target && e.target.id === 'candidateInput') {
      e.preventDefault();
      addCandidateFromInput();
    }
  });

  function handleMetaSnapshot(doc) {
    var meta = doc.exists ? doc.data() : null;
    state.meta = meta;

    if (!meta || meta.status === 'setup') {
      state.view = 'setup';
      if (votesUnsub) { votesUnsub(); votesUnsub = null; }
      render();
      return;
    }

    state.voted = localStorage.getItem('voted_' + meta.pollId) === '1';

    if (state.voted || meta.status === 'closed') {
      state.view = 'results';
      subscribeVotes(meta.pollId, meta.candidates || []);
    } else {
      state.view = 'voting';
    }
    render();
  }

  function init() {
    if (!FIREBASE_CONFIG || FIREBASE_CONFIG.apiKey === 'YOUR_API_KEY') {
      state.view = 'no-config';
      render();
      return;
    }
    try {
      firebase.initializeApp(FIREBASE_CONFIG);
      db = firebase.firestore();
      pollRef = db.collection('polls').doc('current');
      pollRef.onSnapshot(handleMetaSnapshot, function () {
        state.view = 'no-config';
        render();
      });
    } catch (e) {
      state.view = 'no-config';
      render();
    }
  }

  init();
})();
</script>
</body>
</html>
